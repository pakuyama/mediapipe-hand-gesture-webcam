<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나만의 제스처 웹</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --line: #2a2f3a;
      --text: #e8eaf0;
      --muted: #8a91a2;
      --accent: #ff6b2c;
      --bar: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: "Pretendard", "맑은 고딕", "Malgun Gothic", system-ui, sans-serif;
    }
    header { padding: 20px 24px 8px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    main {
      display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px;
      padding: 16px 24px 24px; max-width: 1200px;
    }
    .stage {
      position: relative; aspect-ratio: 4 / 3; background: #000; border-radius: 14px;
      overflow: hidden; border: 1px solid var(--line);
    }
    canvas { width: 100%; height: 100%; display: block; }
    video { display: none; }
    .status {
      position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
      color: var(--muted); font-size: 15px; padding: 24px; background: rgba(0, 0, 0, .55);
    }
    .status[hidden] { display: none; }

    /* 제스처 반응 (나이키 로고 / 👌) */
    .reaction {
      position: absolute; left: 50%; top: 50%; translate: -50% -50%;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      pointer-events: none; opacity: 0; scale: .4;
      transition: opacity .18s ease, scale .35s cubic-bezier(.2, 1.6, .4, 1);
      filter: drop-shadow(0 8px 30px rgba(0, 0, 0, .6));
    }
    .reaction.show { opacity: 1; scale: 1; }
    .reaction .icon { font-size: min(28vw, 220px); line-height: 1; }
    .reaction .icon svg { width: min(52vw, 420px); height: auto; color: #fff; display: block; }
    .reaction .caption {
      font-size: clamp(20px, 4vw, 40px); font-weight: 900; letter-spacing: .04em; font-style: italic;
      color: #fff; text-shadow: 0 2px 12px rgba(0, 0, 0, .7);
    }

    aside { display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    .card h2 { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
    .current { font-size: 34px; font-weight: 800; min-height: 44px; }
    .current small { font-size: 15px; color: var(--muted); font-weight: 500; margin-left: 6px; }
    .bars { display: flex; flex-direction: column; gap: 8px; }
    .bar-row { display: grid; grid-template-columns: 64px 1fr 42px; gap: 8px; align-items: center; font-size: 14px; }
    .bar-row .track { height: 10px; background: #252a35; border-radius: 99px; overflow: hidden; }
    .bar-row .fill { height: 100%; width: 0; background: var(--bar); border-radius: 99px; transition: width .1s linear; }
    .bar-row.top .fill { background: var(--accent); }
    .bar-row .pct { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    label.slider { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
    label.slider span { display: flex; justify-content: space-between; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .hint { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }

    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; padding: 12px 16px 16px; }
      header { padding: 16px 16px 4px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>나만의 제스처 웹</h1>
    <p>gesture_studio.py에서 훈련한 모델로 브라우저에서 실시간 인식합니다.</p>
  </header>
  <main>
    <div class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="canvas" width="640" height="480"></canvas>
      <div class="reaction" id="reaction">
        <div class="icon" id="reactionIcon"></div>
        <div class="caption" id="reactionCaption"></div>
      </div>
      <div class="status" id="status">모델을 불러오는 중…</div>
    </div>
    <aside>
      <div class="card">
        <h2>현재 제스처</h2>
        <div class="current" id="current">-</div>
      </div>
      <div class="card">
        <h2>확률</h2>
        <div class="bars" id="bars"></div>
      </div>
      <div class="card">
        <label class="slider">
          <span>최소 확신도 <b id="minScoreText">0.80</b></span>
          <input type="range" id="minScore" min="0.3" max="0.99" step="0.01" value="0.8">
        </label>
        <p class="hint" style="margin-top:12px">
          같은 제스처가 잠깐 유지되면 반응이 뜹니다.<br>
          반응은 <code>app.js</code>의 <code>REACTIONS</code>에서 바꿀 수 있습니다.
        </p>
      </div>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
